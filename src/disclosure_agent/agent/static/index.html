<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f2">
  <title>GongsiMate · 공시 기반 리서치</title>
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
  <a class="skip" href="#question">질문 입력으로 이동</a>
  <header class="top">
    <button
      id="history-open"
      class="history-open"
      type="button"
      aria-expanded="false"
      aria-controls="history-panel"
    >대화</button>
    <div class="brand">
      <a id="home" class="wordmark" href="/">GongsiMate</a>
      <p class="tagline">공시 기반 리서치</p>
    </div>
    <button
      id="coverage-toggle"
      class="coverage-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="coverage-panel"
      aria-haspopup="dialog"
    >
      <span id="coverage-label">지원 범위</span>
    </button>
  </header>

  <div class="shell">
    <aside id="history-panel" class="history" aria-label="대화 목록">
      <button id="new-conversation" class="new-conversation" type="button">+ 새 대화</button>
      <nav id="history-list" class="history-list" aria-label="이전 대화"></nav>
    </aside>
    <button id="history-dismiss" class="history-backdrop" type="button" hidden aria-label="대화 목록 닫기"></button>

    <main class="workspace">
      <div class="column">
        <div id="transcript" class="transcript">
          <section id="empty" class="empty">
            <p class="eyebrow">공시 원문 기반</p>
            <p class="empty-title">공시 원문으로 기업을 조사합니다.</p>
            <p class="lede">회사와 알고 싶은 내용을 질문하면, 보유한 공시 원문을 읽고 답합니다. 이전 답변은 다음 질문에 자동으로 이어지지 않습니다.</p>
            <div id="prompt-list" class="prompts"></div>
          </section>
        </div>
        <form id="ask-form" class="composer">
          <div class="composer-box">
            <label class="visually-hidden" for="question">질문</label>
            <textarea
              id="question"
              name="question"
              rows="2"
              maxlength="4000"
              placeholder="기업의 실적, 사업, 공시 내용에 대해 질문해보세요"
            ></textarea>
            <div class="composer-actions">
              <button id="send" type="submit" disabled>질문하기</button>
            </div>
          </div>
          <p class="hint">Enter로 질문 · Shift+Enter로 줄바꿈 · 이전 답변은 다음 질문에 자동으로 이어지지 않습니다</p>
          <p id="activity" class="visually-hidden" role="status"></p>
        </form>
      </div>
    </main>
  </div>

  <div id="coverage-panel" class="coverage" hidden>
    <div class="coverage-card" role="dialog" aria-modal="true" aria-labelledby="coverage-title">
      <div class="coverage-head">
        <div>
          <p class="eyebrow">베타</p>
          <h2 id="coverage-title">지원 기업</h2>
        </div>
        <button id="coverage-close" class="text-button" type="button">닫기</button>
      </div>
      <p id="corpus-description" class="coverage-copy">지원 기업을 불러오는 중</p>
      <label class="filter">
        <span class="visually-hidden">기업 이름 검색</span>
        <input id="coverage-filter" type="search" placeholder="기업 이름 검색" autocomplete="off">
      </label>
      <div class="coverage-scroll">
        <ul id="corpus-list"></ul>
        <p id="coverage-empty" class="coverage-copy" hidden>해당하는 기업이 없습니다.</p>
      </div>
    </div>
    <button id="coverage-dismiss" class="coverage-backdrop" type="button" aria-label="지원 범위 닫기"></button>
  </div>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <p id="drawer-kicker" class="eyebrow">원문</p>
      <button id="drawer-close" class="text-button" type="button">닫기</button>
    </div>
    <h2 id="drawer-title">공시 원문</h2>
    <p id="drawer-document" class="drawer-document"></p>
    <h3 id="drawer-source-label" class="source-label">공시 원문</h3>
    <div id="drawer-text" class="drawer-text"></div>
    <h3 id="drawer-facts-label" class="source-label">공시 정보</h3>
    <dl id="drawer-meta" class="facts"></dl>
    <details id="drawer-more" class="technical">
      <summary>기술 정보</summary>
      <dl id="drawer-technical" class="facts"></dl>
    </details>
  </aside>
  <script src="/static/conversations.js" defer></script>
  <script src="/static/chat.js" defer></script>
</body>
</html>
