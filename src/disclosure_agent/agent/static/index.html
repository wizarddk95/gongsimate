<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공시 리서치</title>
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>공시 리서치</h1>
      <p>색인된 공시 원문을 근거로 답합니다. 목록에 없는 기업은 검색하지 않습니다.</p>
    </div>
  </header>
  <div class="layout">
    <aside class="corpus" aria-labelledby="corpus-heading">
      <h2 id="corpus-heading">지원 기업</h2>
      <p id="corpus-description" class="muted">지원 기업을 불러오는 중</p>
      <ul id="corpus-list"></ul>
      <h2>질문 예시</h2>
      <div id="prompt-list" class="prompts"></div>
    </aside>
    <main class="chat">
      <div id="transcript" class="transcript" aria-live="polite"></div>
      <form id="ask-form" class="composer">
        <label class="visually-hidden" for="question">질문</label>
        <textarea id="question" name="question" rows="3" maxlength="4000" required placeholder="지원 기업의 공시에 대해 질문하세요"></textarea>
        <div class="composer-row">
          <p id="activity" class="activity" role="status"></p>
          <button id="send" type="submit">보내기</button>
        </div>
      </form>
      <p class="footnote">이전 답변은 다음 질문에 자동으로 이어지지 않습니다. 회사와 시점을 질문에 적어 주세요.</p>
    </main>
  </div>
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h2 id="drawer-title">근거</h2>
      <button id="drawer-close" type="button">닫기</button>
    </div>
    <dl id="drawer-meta"></dl>
    <div id="drawer-text" class="drawer-text"></div>
    <div id="drawer-locator" class="drawer-locator"></div>
  </aside>
  <script src="/static/chat.js" defer></script>
</body>
</html>
