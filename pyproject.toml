[project]
name = "disclosure-agent"
version = "0.1.0"
description = "DART disclosure discovery and versioned raw sync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
dart-ingest = "disclosure_agent.cli:main"
dart-sync = "disclosure_agent.cli:sync_main"
dart-corp-codes = "disclosure_agent.cli:corp_codes_main"
dart-parse = "disclosure_agent.cli:parse_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
