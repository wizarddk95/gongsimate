[project]
name = "disclosure-agent"
version = "0.1.0"
description = "DART disclosure discovery and versioned raw sync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
dart-ingest = "disclosure_agent.cli:main"
dart-sync = "disclosure_agent.cli:sync_main"
dart-corp-codes = "disclosure_agent.cli:corp_codes_main"
dart-parse = "disclosure_agent.cli:parse_main"
dart-chunk = "disclosure_agent.cli:chunk_main"
dart-eval-bm25 = "disclosure_agent.cli:eval_bm25_main"
dart-eval-dense = "disclosure_agent.cli:eval_dense_main"
dart-eval-rrf = "disclosure_agent.cli:eval_rrf_main"
dart-eval-rrf-zero-tie = "disclosure_agent.cli:eval_rrf_zero_tie_main"
dart-eval-rerank = "disclosure_agent.cli:eval_rerank_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
dense = [
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "torch",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
